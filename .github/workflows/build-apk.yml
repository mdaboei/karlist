name: Build Android APK (کارلیست)

# هر بار که کد push شود یا دستی اجرا کنی، APK می‌سازد
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: نصب پکیج‌ها
        run: npm install

      - name: نصب Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: آماده‌سازی Android SDK
        run: |
          SDKMAN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMAN" ] || SDKMAN="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"

          # پذیرش لایسنس‌ها
          yes | "$SDKMAN" --licenses > /dev/null 2>&1 || true

          # نصب پلتفرم ۳۶ و ابزار بیلد — تا ۵ بار تلاش مجدد در صورت خطای موقت
          ok=0
          for i in 1 2 3 4 5; do
            if "$SDKMAN" "platform-tools" "platforms;android-36" "build-tools;36.0.0"; then
              ok=1
              break
            fi
            echo "تلاش $i ناموفق بود، ۱۵ ثانیه صبر می‌کنیم..."
            sleep 15
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::نصب SDK بعد از ۵ تلاش ناموفق بود"
            exit 1
          fi

      - name: ساخت APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: آماده‌سازی خروجی APK
        uses: actions/upload-artifact@v4
        with:
          name: karlist-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
